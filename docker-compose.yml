version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: planview-db
    environment:
      POSTGRES_USER: planview
      POSTGRES_PASSWORD: planview123
      POSTGRES_DB: planview
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planview"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
